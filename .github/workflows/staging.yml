name: cd

on:
  push:
    branches:
      - develop

jobs:
  staging-deploy:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [14.18.1]

    steps:
      - name: Set NODE_ENV
        run: NODE_ENV=$APP_NODE_ENV
        env:
          APP_NODE_ENV: ${{ secrets.STAGING_NODE_ENV }}

      - name: Checkout 🛎
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install pnpm
        run: |
          export PNPM_HOME="$RUNNER_TEMP/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=12.6.0 sh -
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
            SendEnv APP_DIR
            SendEnv APP_NODE_ENV
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}

      - name: Tar files
        run: >
          tar --ignore-failed-read --exclude=./artifacts.tgz -czvf artifacts.tgz
          .nuxt
          static
          deploy.sh
          nuxt.config.ts
          package.json
          tsconfig.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          || [[ $? -eq 1 ]]

      - name: Copy dist files
        run: |
          echo -n "$UDP_MESSAGE" >/dev/udp/$SSH_HOST/62544
          ssh staging 'mkdir -p $APP_DIR'
          scp -r artifacts.tgz deploy.sh staging:$APP_DIR
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          UDP_MESSAGE: ${{ secrets.STAGING_UDP_MESSAGE }}

      - name: Run deploy script
        run: ssh staging 'cd $APP_DIR && export NODE_ENV=$APP_NODE_ENV && bash deploy.sh'
        env:
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          APP_NODE_ENV: ${{ secrets.STAGING_NODE_ENV }}
